name: Build and test
# Only dev is built on push. main only ever receives a version that was
# already built and tested here on dev and then installed on the person's
# PC, so building it again would only spend Windows minutes. Other branches
# (the ci-* result branches) must never start a run, because a run publishes
# its results over ci-windows and ci-linux. Publishing happens only for dev.
on:
  push:
    branches: [dev]
    # Notes that are not part of the program need no build. (The checklist
    # and the manifest in docs/ are built into the program: they do.)
    paths-ignore:
      - "README.md"
      - "NEXT-STEPS.md"
      - "tools/README.md"
      - "docs/recovery-probe-README.md"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows (the real target)
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      # File names in the tests include Japanese and emoji; the Windows
      # console's own code page cannot print them.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          mkdir -p "$RUNNER_TEMP/report"
          { rustc --version; python --version; } 2>&1 | tee "$RUNNER_TEMP/report/00-versions.txt"
      - name: Build the program
        run: |
          set -o pipefail
          cargo build --release --locked 2>&1 | tee "$RUNNER_TEMP/report/10-build.txt"
      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --release --locked 2>&1 | tee "$RUNNER_TEMP/report/20-unit-tests.txt"
      - name: Starting a copy with administrator rights, as a double-click does
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          set -o pipefail
          target/release/automatic-recovery-probe.exe check-start-elevated 2>&1 | tee "$RUNNER_TEMP/report/22-start-elevated.txt"
      - name: Built-in self-test (what the person runs first)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          target/release/automatic-recovery-probe.exe self-test 2>&1 | tee "$RUNNER_TEMP/report/25-self-test.txt"
          echo "::notice title=Self-test::$(tail -n 1 "$RUNNER_TEMP/report/25-self-test.txt")"
      - name: Map check on test disks with known damage
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python tools/test_mapcheck.py target/release/automatic-recovery-probe.exe "$RUNNER_TEMP/mc" --random 30 2>&1 | tee "$RUNNER_TEMP/report/40-map-check-tests.txt"
          echo "::notice title=Map check tests::$(tail -n 1 "$RUNNER_TEMP/report/40-map-check-tests.txt")"
      - name: Map check against Windows itself (virtual disks)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python tools/windows_check.py target/release/automatic-recovery-probe.exe "$RUNNER_TEMP/wc" 2>&1 | tee "$RUNNER_TEMP/report/50-windows-disks.txt"
          echo "::notice title=Windows disks::$(tail -n 1 "$RUNNER_TEMP/report/50-windows-disks.txt")"
      - name: Keeping Windows from writing to the recovered disk (virtual disks)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python tools/guard_check.py target/release/automatic-recovery-probe.exe "$RUNNER_TEMP/gc" 2>&1 | tee "$RUNNER_TEMP/report/60-disk-protection.txt"
          echo "::notice title=Disk protection::$(tail -n 1 "$RUNNER_TEMP/report/60-disk-protection.txt")"
      - name: The recovered disk unplugged in the middle of copying it (virtual disks, through the page)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set +e -o pipefail
          python tools/dropout_check.py target/release/automatic-recovery-probe.exe "$RUNNER_TEMP/dc" 2>&1 | tee "$RUNNER_TEMP/report/65-unplugged.txt"
          status=$?
          cp "$RUNNER_TEMP/dc/home/server-output.txt" "$RUNNER_TEMP/report/65-unplugged-server-output.txt" 2>/dev/null || true
          echo "::notice title=Unplugged mid-copy::$(tail -n 1 "$RUNNER_TEMP/report/65-unplugged.txt")"
          exit $status
      - name: The step-by-step page, in a real browser
        if: ${{ !cancelled() }}
        run: |
          set +e -o pipefail
          {
            python tools/make_selftest_disk.py &&
            { git diff --exit-code --stat -- src/selftest || { echo "src/selftest is not what tools/make_selftest_disk.py makes"; cp src/selftest/disk.bin "$RUNNER_TEMP/report/selftest-disk-made-on-windows.bin"; false; }; } &&
            npm install --no-save --silent playwright@1.56.1 &&
            npx playwright install chromium &&
            node tools/ui_check.js target/release/automatic-recovery-probe.exe "$RUNNER_TEMP/ui" target/selftest-build/disk.img src/selftest/disk.map
          } 2>&1 | tee "$RUNNER_TEMP/report/70-page.txt"
          status=$?
          cp "$RUNNER_TEMP"/ui/*.png "$RUNNER_TEMP"/ui/server-output.txt "$RUNNER_TEMP/report/" 2>/dev/null || true
          echo "::notice title=Page::$(tail -n 1 "$RUNNER_TEMP/report/70-page.txt")"
          exit $status
      - name: The open-source tools (as on the person's PC)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          choco install ffmpeg qpdf -y --no-progress > "$RUNNER_TEMP/report/80-tools-install.txt" 2>&1 || true
          dl="$RUNNER_TEMP/tools-dl"
          mkdir -p "$dl"
          # Chocolatey's feed is down at times (30 Oct 2026: a 404 for every
          # package): FFmpeg then from gyan.dev itself, the "essentials" build
          # Chocolatey installs and the PC has. (qpdf comes from Get ready's
          # own download, the next step, either way.)
          if ! command -v ffmpeg > /dev/null; then
            {
              echo "Chocolatey gave no FFmpeg: gyan.dev's essentials build instead."
              curl -sSfL -o "$dl/ffmpeg.zip" "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" &&
                (mkdir -p "$dl/ffmpeg" && cd "$dl/ffmpeg" && "/c/Program Files/7-Zip/7z.exe" x -y ../ffmpeg.zip > /dev/null)
            } >> "$RUNNER_TEMP/report/80-tools-install.txt" 2>&1 || true
            found=$(find "$dl/ffmpeg" -iname ffmpeg.exe 2>/dev/null | head -1 || true)
            if [ -n "$found" ]; then
              cygpath -w "$(dirname "$found")" >> "$GITHUB_PATH"
              export PATH="$(dirname "$found"):$PATH"
            fi
          fi
          # untrunc's and MP3val's own Windows builds, as the person has them
          # in "installed files" (the program finds them on the PATH here).
          {
            gh release download latest --repo anthwlock/untrunc --pattern '*x64*.zip' --dir "$dl/untrunc" &&
              (cd "$dl/untrunc" && "/c/Program Files/7-Zip/7z.exe" x -y *.zip > /dev/null)
            curl -sSfL -o "$dl/mp3val.zip" "https://sourceforge.net/projects/mp3val/files/mp3val/mp3val%200.1.8/mp3val-0.1.8-bin-win32.zip/download" &&
              (mkdir -p "$dl/mp3val" && cd "$dl/mp3val" && "/c/Program Files/7-Zip/7z.exe" x -y ../mp3val.zip > /dev/null)
            ls -R "$dl"
          } >> "$RUNNER_TEMP/report/80-tools-install.txt" 2>&1 || true
          for exe in untrunc.exe mp3val.exe; do
            found=$(find "$dl" -iname "$exe" | head -1)
            if [ -n "$found" ]; then cygpath -w "$(dirname "$found")" >> "$GITHUB_PATH"; fi
          done
          {
            echo "7z: $(ls "/c/Program Files/7-Zip/7z.exe" 2>&1)"
            ffmpeg -hide_banner -version 2>&1 | head -1
            if command -v qpdf > /dev/null; then qpdf --version 2>&1 | head -1; else echo "qpdf: not from Chocolatey (Get ready's download, next, gives it)"; fi
            echo "untrunc: $(find "$dl" -iname untrunc.exe | head -1)"
            echo "mp3val: $(find "$dl" -iname mp3val.exe | head -1)"
          } 2>&1 | tee "$RUNNER_TEMP/report/80-tools.txt"
      - name: Get ready's qpdf download, for real (the tests below then use it, as the PC will)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          set +e -o pipefail
          python tools/download_check.py target/release/automatic-recovery-probe.exe "$RUNNER_TEMP/dl" 2>&1 | tee "$RUNNER_TEMP/report/81-download.txt"
          status=$?
          q=$(find "$RUNNER_TEMP/dl/home/tools" -iname qpdf.exe 2>/dev/null | head -1)
          if [ -n "$q" ]; then cygpath -w "$(dirname "$q")" >> "$GITHUB_PATH"; fi
          echo "::notice title=Download::$(tail -n 1 "$RUNNER_TEMP/report/81-download.txt")"
          exit $status
      - name: Start, the whole automatic recovery, on a damaged test disk of real media
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set +e -o pipefail
          python tools/auto_check.py target/release/automatic-recovery-probe.exe "$RUNNER_TEMP/ac" 2>&1 | tee "$RUNNER_TEMP/report/82-automatic.txt"
          status=$?
          cp "$RUNNER_TEMP/ac/home/server-output.txt" "$RUNNER_TEMP/report/82-automatic-server-output.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/ac/auto-repair-log.txt" "$RUNNER_TEMP/report/83-auto-repair-log.txt" 2>/dev/null || true
          echo "::notice title=Automatic::$(tail -n 1 "$RUNNER_TEMP/report/82-automatic.txt")"
          exit $status
      - name: The Automatic tab, in a real browser
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set +e -o pipefail
          node tools/auto_ui_check.js target/release/automatic-recovery-probe.exe "$RUNNER_TEMP/aui" target/selftest-build/disk.img src/selftest/disk.map 2>&1 | tee "$RUNNER_TEMP/report/84-automatic-page.txt"
          status=$?
          cp "$RUNNER_TEMP"/aui/*.png "$RUNNER_TEMP/report/" 2>/dev/null || true
          echo "::notice title=Automatic page::$(tail -n 1 "$RUNNER_TEMP/report/84-automatic-page.txt")"
          exit $status
      - name: Start stopped and killed at random moments, carried on each time
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set +e -o pipefail
          python tools/resume_check.py target/release/automatic-recovery-probe.exe "$RUNNER_TEMP/rc" 3 12 2>&1 | tee "$RUNNER_TEMP/report/85-resume.txt"
          status=$?
          echo "::notice title=Resume::$(tail -n 1 "$RUNNER_TEMP/report/85-resume.txt")"
          exit $status
      - name: Publish the program and the report to the ci-windows branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          out="$RUNNER_TEMP/publish"
          mkdir -p "$out"
          cp -r "$RUNNER_TEMP/report/." "$out/" 2>/dev/null || true
          if [ -f target/release/automatic-recovery-probe.exe ]; then cp target/release/automatic-recovery-probe.exe "$out/"; fi
          printf 'commit %s\nrun %s\nresult %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ job.status }}" > "$out/BUILD-INFO.txt"
          cd "$out"
          git init -q -b ci-windows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows build of ${GITHUB_SHA::7} (${{ job.status }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-windows
      - name: Keep the program as a download
        uses: actions/upload-artifact@v7
        with:
          name: automatic-recovery-probe-windows
          path: target/release/automatic-recovery-probe.exe
          if-no-files-found: error
          # (The ci-windows branch keeps the latest; these only need to last a while.)
          retention-days: 14
  linux:
    name: Linux (more checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          set -o pipefail
          { cargo build --release --locked && cargo test --release --locked; } 2>&1 | tee "$RUNNER_TEMP/report/20-build-and-unit-tests.txt"
      - name: Unit tests with overflow checks
        if: ${{ !cancelled() }}
        run: |
          # (A debug build stops on any sum that runs past its type's range:
          # the release build would wrap round silently.)
          set -o pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/report/21-unit-tests-overflow-checked.txt"
      - name: Built-in self-test
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          target/release/automatic-recovery-probe self-test 2>&1 | tee "$RUNNER_TEMP/report/25-self-test.txt"
      - name: Tools that check the test disks independently
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exfatprogs
          python3 -m pip install --break-system-packages -q dissect.fat
          { fsck.exfat -V; python3 -c "import dissect.fat; print('dissect.fat', getattr(dissect.fat, '__version__', 'installed'))"; } 2>&1 | tee "$RUNNER_TEMP/report/35-tools.txt"
      - name: Map check on test disks with known damage
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 tools/test_mapcheck.py target/release/automatic-recovery-probe "$RUNNER_TEMP/mc" --random 80 --fsck "$(command -v fsck.exfat)" --dissect installed 2>&1 | tee "$RUNNER_TEMP/report/40-map-check-tests.txt"
          echo "::notice title=Map check tests (Linux)::$(tail -n 1 "$RUNNER_TEMP/report/40-map-check-tests.txt")"
      - name: Test disks against the Linux kernel's exFAT driver
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          # GitHub's Ubuntu kernel keeps the exFAT driver in the extra modules package.
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || true
          sudo modprobe exfat && echo "exfat module loaded" || echo "the exfat module could not be loaded"
          sudo python3 tools/kernel_check.py "$RUNNER_TEMP/kc" 16 2>&1 | tee "$RUNNER_TEMP/report/45-linux-kernel.txt"
          echo "::notice title=Linux kernel::$(tail -n 1 "$RUNNER_TEMP/report/45-linux-kernel.txt")"
      - name: The step-by-step page, in a real browser
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 tools/make_selftest_disk.py
          git diff --exit-code --stat -- src/selftest || { echo "src/selftest is not what tools/make_selftest_disk.py makes"; exit 1; }
          npm install --no-save --silent playwright@1.56.1
          npx playwright install --with-deps chromium
          node tools/ui_check.js target/release/automatic-recovery-probe "$RUNNER_TEMP/ui" target/selftest-build/disk.img src/selftest/disk.map 2>&1 | tee "$RUNNER_TEMP/report/70-page.txt"
          echo "::notice title=Page (Linux)::$(tail -n 1 "$RUNNER_TEMP/report/70-page.txt")"
      - name: The open-source tools (untrunc built from its own source)
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y -qq ffmpeg p7zip-full mp3val qpdf libavformat-dev libavcodec-dev libavutil-dev > /dev/null
          git clone -q --depth 1 https://github.com/anthwlock/untrunc "$RUNNER_TEMP/untrunc-src"
          make -s -C "$RUNNER_TEMP/untrunc-src" > "$RUNNER_TEMP/report/80-untrunc-build.txt" 2>&1 && sudo cp "$RUNNER_TEMP/untrunc-src/untrunc" /usr/local/bin/
          {
            7z | head -2 | tail -1; ffmpeg -hide_banner -version | head -1; mp3val 2>&1 | head -2 | tail -1; qpdf --version | head -1
            untrunc -V 2>&1 | head -1 || echo "untrunc did not build"
          } 2>&1 | tee "$RUNNER_TEMP/report/80-tools.txt"
      - name: Start, the whole automatic recovery, on a damaged test disk of real media
        if: ${{ !cancelled() }}
        run: |
          set +e -o pipefail
          python3 tools/auto_check.py target/release/automatic-recovery-probe "$RUNNER_TEMP/ac" 2>&1 | tee "$RUNNER_TEMP/report/82-automatic.txt"
          status=$?
          cp "$RUNNER_TEMP/ac/auto-repair-log.txt" "$RUNNER_TEMP/report/83-auto-repair-log.txt" 2>/dev/null || true
          echo "::notice title=Automatic (Linux)::$(tail -n 1 "$RUNNER_TEMP/report/82-automatic.txt")"
          exit $status
      - name: The Automatic tab, in a real browser
        if: ${{ !cancelled() }}
        run: |
          set +e -o pipefail
          node tools/auto_ui_check.js target/release/automatic-recovery-probe "$RUNNER_TEMP/aui" target/selftest-build/disk.img src/selftest/disk.map 2>&1 | tee "$RUNNER_TEMP/report/84-automatic-page.txt"
          status=$?
          cp "$RUNNER_TEMP"/aui/*.png "$RUNNER_TEMP/report/" 2>/dev/null || true
          echo "::notice title=Automatic page (Linux)::$(tail -n 1 "$RUNNER_TEMP/report/84-automatic-page.txt")"
          exit $status
      - name: Start stopped and killed at random moments, carried on each time
        if: ${{ !cancelled() }}
        run: |
          set +e -o pipefail
          python3 tools/resume_check.py target/release/automatic-recovery-probe "$RUNNER_TEMP/rc" 5 20 2>&1 | tee "$RUNNER_TEMP/report/85-resume.txt"
          status=$?
          echo "::notice title=Resume (Linux)::$(tail -n 1 "$RUNNER_TEMP/report/85-resume.txt")"
          exit $status
      - name: Publish the report to the ci-linux branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          out="$RUNNER_TEMP/publish"
          mkdir -p "$out"
          cp -r "$RUNNER_TEMP/report/." "$out/" 2>/dev/null || true
          printf 'commit %s\nrun %s\nresult %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ job.status }}" > "$out/BUILD-INFO.txt"
          cd "$out"
          git init -q -b ci-linux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Linux checks of ${GITHUB_SHA::7} (${{ job.status }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-linux
